<h1>ELECTROSHOP</h1>

<button (click)="showLaptop()">Show Laptop</button>
<button (click)="showHeadphones()">Show Wireless Headphones</button>

<app-product-details-component
  [productName]="productName()"
  [productDescription]="productDescription()"
  [productPrice]="productPrice()"
  [isAvailable]="isAvailable()"
  (cartAdded)="addToCart($event.name, $event.quantity)">
</app-product-details-component>

<app-shopping-cart-component
  [productName]="cartName()"
  [productPrice]="cartPrice()"
  [quantity]="cartQuantity()">
</app-shopping-cart-component>
